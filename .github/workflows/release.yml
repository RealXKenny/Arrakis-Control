name: Release Docker Image

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release version
        id: version
        shell: bash
        run: |
          node src/scripts/check-version.js
          VERSION="$(tr -d '\r\n' < VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Synchronize package.json version
        run: node src/scripts/sync-version.js

      - name: Commit synchronized package version
        shell: bash
        run: |
          if git diff --quiet -- package.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json
          git commit -m "chore: sync package version v${{ steps.version.outputs.version }}"

          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"

            if git rebase "origin/${{ github.ref_name }}"; then
              if git push origin HEAD:${{ github.ref_name }}; then
                exit 0
              fi
            fi

            echo "Push attempt ${attempt} failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 2
          done

          echo "Failed to push synchronized package version."
          exit 1

      - name: Generate detailed release notes
        run: node src/scripts/generate-release-notes.js "$RUNNER_TEMP/release-notes.md"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BOT_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/arrakis-control:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/arrakis-control:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Arrakis Control v${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
