<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hagga Basin Live Map</title><link rel="stylesheet" href="/styles.css"></head><body><main class="map-page"><div class="topline"><span class="badge">LIVE CARTOGRAPHY</span><a class="button" href="/portal">Back to portal</a></div><p class="eyebrow">HAGGA BASIN • LIVE MAP</p><h1>Read the desert.</h1><div class="map-viewport"><div class="map-canvas"><img src="/hagga-basin.png" alt="Hagga Basin map"><div id="markers"></div></div></div><div id="map" class="server-card">Loading map data…</div></main><script>const map=document.querySelector('.map-canvas');const viewport=document.querySelector('.map-viewport');let scale=.65,x=0,y=0,drag=false,sx=0,sy=0;function apply(){map.style.transform=`translate(${x}px,${y}px) scale(${scale})`}viewport.onwheel=e=>{e.preventDefault();scale=Math.max(.35,Math.min(3,scale*(e.deltaY<0?1.12:.89)));apply()};viewport.onpointerdown=e=>{drag=true;sx=e.clientX;sy=e.clientY;viewport.setPointerCapture(e.pointerId)};viewport.onpointermove=e=>{if(drag){x+=e.clientX-sx;y+=e.clientY-sy;sx=e.clientX;sy=e.clientY;apply()}};viewport.onpointerup=()=>drag=false;fetch('/api/map').then(r=>r.json()).then(d=>{const rows=d.bases?.rows||[];document.getElementById('markers').innerHTML=rows.map(b=>{const px=((Number(b.x)+300000)/600000)*100,py=(1-((Number(b.y)+300000)/600000))*100;return `<span class="map-marker base" style="left:${px}%;top:${py}%" title="${b.name||'Base'}"><img src="/map-icons/Base.webp" alt="Base"></span>`}).join('');document.getElementById('map').textContent=`${rows.length} bases visible`}).catch(()=>document.getElementById('map').textContent='Map data unavailable');apply();</script></body></html>
